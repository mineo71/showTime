name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  # The same unit and integration jobs as every push: nothing is published unless both pass.
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@11 # trusted publishing needs npm ≥ 11.5.1
      - run: npm ci

      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@mineo71/showtime@$version" version > /dev/null 2>&1; then
            echo "@mineo71/showtime@$version is already on npm, skipping"
          else
            npm publish
          fi

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npx tsx scripts/changelog.ts notes "${GITHUB_REF_NAME#v}" > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
          else
            gh release create "$GITHUB_REF_NAME" --title "showTime ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
          fi
