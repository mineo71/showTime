name: tests

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_call:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Records with Playwright, encodes with ffmpeg and renders with Remotion, as a user's machine does.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - name: Remotion's browser
        run: node --input-type=module -e "const { ensureBrowser } = await import('@remotion/renderer'); await ensureBrowser();"
      - run: npm run test:int
