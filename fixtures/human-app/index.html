<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Inbox</title>
    <style>body { font: 16px system-ui; padding: 24px; } a, button, div { display: block; margin: 12px 0; }</style>
  </head>
  <body>
    <a href="#inbox" id="inbox">Inbox 12</a>
    <button id="long">Read the full release notes for version 4.2 today</button>
    <button>Save <span>draft</span></button>
    <div id="plain-save">Save</div>
    <a href="popup.html" target="_blank">Open the popup</a>
    <p id="out"></p>
    <script>
      for (const el of document.querySelectorAll('a, button, div')) el.addEventListener('click', () => (document.getElementById('out').textContent = el.textContent));
    </script>
  </body>
</html>
